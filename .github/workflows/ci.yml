# Thin CI (DEC-25): every `run:` line is a local command documented in AGENTS.md.
# Actions are pinned to full commit SHAs of releases at least 14 days old (DEC-45);
# refresh them with the monthly routine in docs/maintenance.md (step 02.15).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.2" # newest uv release at least 14 days old when pinned (2026-11-02)
  COMMITIZEN_VERSION: "4.19.2" # newest commitizen release at least 14 days old when pinned (2026-11-02)
  GITLEAKS_VERSION: "8.30.1" # newest gitleaks release at least 14 days old when pinned (2026-11-02)
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz; matches the release's checksums file and GitHub's asset digest.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.0" # newest Trivy release at least 14 days old when pinned (2026-11-02); immutable release
  # SHA-256 of trivy_0.76.0_Linux-64bit.tar.gz; matches the release's checksums file and GitHub's asset digest.
  TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_repo_hygiene.py
      - name: requirements.txt matches uv.lock
        run: uv export --no-dev --no-hashes -o requirements.txt && git diff --exit-code -- requirements.txt

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux only (DEC-49, 2026-11-03). To bring Windows or macOS back, add windows-latest or macos-latest
        # here (after a new DEC); tests-passed and the branch ruleset need no change.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: py${{ matrix.python }} # one cache per Python version; avoids save races
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # One stable name for branch protection (step 02.16), so matrix changes don't require a ruleset edit.
  # `always()`, not `!cancelled()`: a skipped job would count as passing for a required check.
  tests-passed:
    name: tests-passed
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every test matrix cell passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test matrix result: $RESULT"
          test "$RESULT" = "success"

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the PR's base commit is available
          ref: ${{ github.event.pull_request.head.sha }} # the PR's own commits, not GitHub's merge ref
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # nothing worth caching; also avoids racing the quality job's cache key
      - name: Commit messages follow Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --exclude-newer applies the 14-day cooldown (DEC-45) to commitizen's own dependencies too:
        # uvx ignores the project's [tool.uv] settings.
        run: >-
          uvx --exclude-newer "14 days" --from "commitizen==${COMMITIZEN_VERSION}"
          cz check --rev-range "${BASE_SHA}..${HEAD_SHA}"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the scanned range's base commit is available
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A release binary checked against a pinned SHA-256, not a third-party action: security tools' actions
      # have been hijacked through re-pointed tags (e.g. tj-actions/changed-files, March 2025).
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan new commits for secrets
        env:
          # PRs: the PR's own commits. Pushes to main: the pushed commits. Full history is scanned weekly.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: >-
          gitleaks git --config .gitleaks.toml --redact --no-banner --verbose
          --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # avoids racing the quality job's cache key
      # The license scan reads license metadata from installed packages; lockfiles don't carry it.
      - run: uv sync --locked --no-dev
      # Release binary checked against a pinned SHA-256. Never Trivy's own actions: trivy-action and setup-trivy
      # tags were hijacked in March 2026, and a malicious v0.69.4 binary was published (GHSA-69fq-xp46-6x23; DEC-48).
      - name: Install Trivy (pinned release, SHA-256 verified)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # uv.lock, dev dependencies included. requirements.txt is skipped: it's generated from uv.lock (02.9), so
      # it would only repeat the same findings. Accepted findings live in .trivyignore, each with an expiry date.
      - name: Vulnerabilities (fail on fixable HIGH and CRITICAL)
        run: >-
          trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --show-suppressed --no-progress --skip-dirs .venv --skip-files requirements.txt .
      # Report only: a failing license policy needs an owner decision first (step 02.13).
      - name: Licenses of runtime dependencies (report only)
        if: ${{ !cancelled() }}
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: >-
          trivy fs --scanners license --exit-code 0 --no-progress --skip-dirs .venv --skip-files uv.lock .
