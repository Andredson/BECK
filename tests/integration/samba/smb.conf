# Test server for BECK. The bios share copies the settings of a real Recalbox 10.1.1 (Samba 4.19).
[global]
   workgroup = WORKGROUP
   server role = standalone server
   # SMB 2.02 is the default, and what Recalbox 10.1.1 uses. pysmb can't connect if it's raised.
   server min protocol = SMB2_02
   smb ports = 445
   disable netbios = yes
   map to guest = bad user
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes

# Like Recalbox's bios share: guests can write.
[bios]
   comment = Recalbox-like BIOS share
   path = /srv/samba/bios
   writeable = yes
   guest ok = yes
   create mask = 0644
   directory mask = 0755
   force user = root
   veto files = /._*/.DS_Store/
   delete veto files = yes

# Only the user beck, for password logins.
[private]
   path = /srv/samba/private
   writeable = yes
   guest ok = no
   valid users = beck

# Guests can read but not write, for error paths.
[readonly]
   path = /srv/samba/readonly
   read only = yes
   guest ok = yes
