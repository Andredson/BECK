[project]
name = "beck-bios"
version = "1.0.0"
description = "Match your BIOS files by MD5 and send them to the right folder on your Recalbox"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# A name only: PyPI publishes whatever goes here, for good.
authors = [{ name = "Andre Salvo" }]
keywords = ["recalbox", "bios", "retrogaming", "emulation", "smb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.13.5,<5",
    "pysmb>=1.2.9.1,<2",
]

[project.urls]
Homepage = "https://github.com/Andredson/BECK"
Source = "https://github.com/Andredson/BECK"
Issues = "https://github.com/Andredson/BECK/issues"
Changelog = "https://github.com/Andredson/BECK/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Andredson/BECK#readme"

[project.scripts]
beck = "beck.cli:main"

[build-system]
# The lower bound is CI's uv version, so uv uses its built-in backend and downloads nothing.
requires = ["uv_build>=0.13.2,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "beck" # the distribution is beck-bios, the import name is beck

[tool.uv]
# Supply-chain cooldown (DEC-45): only resolve releases uploaded at least 14 days ago.
# For an urgent security fix, override per package with `exclude-newer-package` and record why.
exclude-newer = "14 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit security rules (SAST, DEC-32).
# D = docstrings, for src/ only (step 08.5).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "PTH", "RUF", "S", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
"!src/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# pysmb ships no type hints; BECK keeps it (DEC-53).
module = ["smb.*", "nmb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: needs the Samba test container (stage 05)"]

[tool.coverage.run]
branch = true
source = ["beck"]

[tool.coverage.report]
# Checked on the unit run, `uv run pytest --cov`. Integration tests cover behavior, not lines.
fail_under = 90
show_missing = true
# Replaces coverage's defaults, so `# pragma: no cover` can't hide code from the gate.
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Commit-message rule checked in CI by `cz check` (DEC-38). Commitizen is used only for checking:
# versions come from `uv version --bump` (DEC-18) and the changelog from git-cliff (DEC-20).
[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
]
