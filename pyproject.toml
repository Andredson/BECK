[project]
name = "beck-bios"
version = "0.1.0"
description = "Match your BIOS files by MD5 and send them to the right folder on your Recalbox"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "pysmb>=1.2.9.1,<2",
    "PyYAML>=6.0.2,<7",
]

[tool.uv]
# Not an installable package yet: the src/beck package arrives in stage 04 (step 04.3).
package = false
# Supply-chain cooldown (DEC-45): only resolve releases uploaded at least 14 days ago.
# For an urgent security fix, override per package with `exclude-newer-package` and record why.
exclude-newer = "14 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit security rules (SAST, DEC-32).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
# Legacy script: temporary ignores. Each one names the step in
# roadmap/03-critical-fixes-and-data-safety.md that removes it; 03.12 removes whatever is left.
"check_bios.py" = [
    "PTH120", # os.path.dirname                                      -> 03.11
    "PTH123", # builtin open() instead of Path.open()                -> 03.11
    "E501",   # long message lines                                   -> 03.12
    "E722",   # bare except                                          -> 03.12
    "E741",   # ambiguous variable name `l`                          -> 03.12
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["check_bios.py", "tests", "scripts"]

[[tool.mypy.overrides]]
# Legacy script: untyped functions allowed until stage 04 (step 04.14 removes this override).
module = ["check_bios"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# pysmb ships no type hints; it is replaced by smbprotocol in step 04.9.
module = ["smb.*", "nmb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: needs the Samba test container (stage 05)"]

[tool.coverage.run]
branch = true
source = ["check_bios"]

# Commit-message rule checked in CI by `cz check` (DEC-38). Commitizen is used only for checking:
# versions come from `uv version --bump` (DEC-18) and the changelog from git-cliff (DEC-20).
[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
